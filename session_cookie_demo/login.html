<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
</head>

<body>

    <h2>Login Form</h2>

    <form action="login.php" method="POST">

        <label>Name:</label>
        <input
            type="text"
            name="name"
            required
        >

        <br><br>

        <label>Password:</label>
        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <input
            type="submit"
            value="Login"
        >

    </form>

</body>

</html>
